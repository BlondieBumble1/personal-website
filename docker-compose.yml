services:
  personal-website:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: personal-website

    expose:
      - "80"

    volumes:
      - ./src:/usr/share/nginx/html

    networks:
      - web

    restart: unless-stopped

  reverse-proxy:
    image: nginx:alpine

    container_name: reverse-proxy

    ports:
      - "80:80"

    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - web

    depends_on:
      - personal-website

    restart: unless-stopped

networks:
  web:
    name: web